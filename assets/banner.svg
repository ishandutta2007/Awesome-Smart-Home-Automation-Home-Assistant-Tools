<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03A9F4" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03A9F4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .code-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* Subtle pulsing / floating animated elements in background */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.65; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes pulseOrb2 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(-15px, 12px); opacity: 0.55; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.3; r: 4; }
      50% { opacity: 1; r: 6.5; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 250px; }
    .data-line { stroke: #00D2FF; stroke-width: 1.5; stroke-dasharray: 4 6; stroke-opacity: 0.5; animation: dashMove 2.5s linear infinite; }
    .beacon { animation: beaconBlink 3s ease-in-out infinite; }
    .beacon-delay { animation: beaconBlink 3s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (Strictly in Background) -->
  <g class="orb-1">
    <circle cx="180" cy="100" r="130" fill="url(#glowGrad)" filter="url(#glow)" />
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="240" r="160" fill="url(#glowGrad)" filter="url(#glow)" />
  </g>

  <!-- Futuristic Smart Home Mesh / Topology Lines in Background -->
  <g opacity="0.35">
    <line x1="80" y1="60" x2="260" y2="120" stroke="#1f4068" stroke-width="1.2" />
    <line x1="260" y1="120" x2="380" y2="70" stroke="#1f4068" stroke-width="1.2" />
    <line x1="380" y1="70" x2="520" y2="130" stroke="#1f4068" stroke-width="1.2" />
    <line x1="820" y1="80" x2="960" y2="140" stroke="#1f4068" stroke-width="1.2" />
    <line x1="960" y1="140" x2="1120" y2="90" stroke="#1f4068" stroke-width="1.2" />
    <line x1="960" y1="140" x2="1050" y2="280" stroke="#1f4068" stroke-width="1.2" />

    <!-- Animated Data Stream Lines -->
    <path d="M 80,60 L 260,120 L 380,70" class="data-line" fill="none" />
    <path d="M 820,80 L 960,140 L 1120,90" class="data-line" fill="none" />

    <!-- Mesh Nodes -->
    <circle cx="80" cy="60" r="4" fill="#03A9F4" />
    <circle cx="260" cy="120" r="5" fill="#38ef7d" class="beacon" />
    <circle cx="380" cy="70" r="4" fill="#00D2FF" />
    <circle cx="520" cy="130" r="3.5" fill="#03A9F4" />
    <circle cx="820" cy="80" r="4" fill="#38ef7d" />
    <circle cx="960" cy="140" r="5.5" fill="#00D2FF" class="beacon-delay" />
    <circle cx="1120" cy="90" r="4" fill="#03A9F4" />
    <circle cx="1050" cy="280" r="4" fill="#38ef7d" />
  </g>

  <!-- Foreground Content Container (Ensures 100% legibility and prominent layering) -->
  <g class="code-font" id="foreground-content">
    
    <!-- Top Pill / Category Tag -->
    <g transform="translate(600, 52)">
      <rect x="-190" y="0" width="380" height="30" rx="15" fill="#0f2b48" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="0" y="19" text-anchor="middle" fill="#00D2FF" font-size="12" font-weight="700" letter-spacing="1.5">
        ⚡ LOCAL-FIRST &#x2022; HOME ASSISTANT &#x2022; AI MCP ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(600, 130)">
      <!-- Soft Shadow behind title for contrast -->
      <text x="0" y="0" text-anchor="middle" fill="url(#primaryGrad)" font-size="38" font-weight="900" letter-spacing="-0.5" filter="url(#shadow)">
        Smart Home Automation &amp; Home Assistant Tools
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(600, 172)">
      <text x="0" y="0" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="500" letter-spacing="0.2">
        Curated SaaS Platforms, Self-Hosted Hubs, AI MCP Bridges, HACS Integrations &amp; Firmware
      </text>
    </g>

    <!-- Feature Pillars / Tech Pills in Foreground -->
    <g transform="translate(600, 230)">
      <!-- Pill 1: Home Assistant -->
      <g transform="translate(-430, 0)">
        <rect x="0" y="0" width="160" height="42" rx="10" fill="#132337" stroke="#03A9F4" stroke-width="1.2" />
        <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="600">🏠 Home Assistant</text>
      </g>
      <!-- Pill 2: Zigbee & Matter -->
      <g transform="translate(-250, 0)">
        <rect x="0" y="0" width="160" height="42" rx="10" fill="#132337" stroke="#22d3ee" stroke-width="1.2" />
        <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="600">📡 Zigbee &amp; Matter</text>
      </g>
      <!-- Pill 3: Model Context Protocol -->
      <g transform="translate(-70, 0)">
        <rect x="0" y="0" width="150" height="42" rx="10" fill="#132337" stroke="#38ef7d" stroke-width="1.2" />
        <text x="75" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="600">🤖 AI MCP Bridges</text>
      </g>
      <!-- Pill 4: ESPHome & Firmware -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="160" height="42" rx="10" fill="#132337" stroke="#38bdf8" stroke-width="1.2" />
        <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="600">🔌 ESPHome &amp; IoT</text>
      </g>
      <!-- Pill 5: Local Privacy -->
      <g transform="translate(280, 0)">
        <rect x="0" y="0" width="150" height="42" rx="10" fill="#132337" stroke="#818cf8" stroke-width="1.2" />
        <text x="75" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="600">🔒 100% Local-First</text>
      </g>
    </g>

    <!-- Bottom Metric / Status Summary Line -->
    <g transform="translate(600, 315)">
      <text x="0" y="0" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="400">
        🌟 20+ Active Open-Source Repositories &#x2022; 🌐 Top SaaS Ecosystems &#x2022; 🔒 Privacy &amp; Local Automation
      </text>
    </g>
  </g>
</svg>
